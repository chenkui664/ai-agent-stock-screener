name: AI 智能体 Top 10 股票热力榜

on:
  schedule:
    # 每天 11:00 北京时间 (UTC+8) = 03:00 UTC
    - cron: '0 3 * * *'
  
  # 允许手动触发
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.12'
  
jobs:
  run-stock-screener:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        shell: bash
        working-directory: ${{ github.workspace }}
      
      - name: 运行主程序
        env:
          # 概念配置（从 Variables 读取）
          CONCEPT_KEY: ${{ vars.CONCEPT_KEY }}
          TOP_N: ${{ vars.TOP_N }}
          CANDIDATE_N: ${{ vars.CANDIDATE_N }}
          
          # 飞书 Webhook（从 Secrets 读取）
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          
          # 大模型 API Key
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
        run: python main.py
        shell: bash
